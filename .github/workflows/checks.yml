name: checks

# Required status checks: lint, csharp, compose, e2e, windows-direct, secrets, python-package-ok.
# Branch protection refers to these job names; rename them only together with it.
# python-package-ok sums up python-package and its test matrix, python-package-test, whose
# job names depend on the matrix. The release workflow runs this whole file again
# (workflow_call) before it publishes a release.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: The source stays private (no gateway source or its tests here)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(halow_alert\.py|test_halow_alert\.py|Dockerfile)$'; then
            echo "::error::the files above belong in the private source repository, not here"; exit 1
          fi
          if grep -rnE '^[[:space:]]*(import|from)[[:space:]]+halow_alert\b' --include='*.py' integrations tools .github; then
            echo "::error::integrations and tools must not import halow_alert"; exit 1
          fi

      - name: Python syntax
        run: python -m py_compile integrations/python/*.py integrations/python/tests/*.py tools/*.py .github/scripts/*.py
      - name: ruff (Python 3.8 target)
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.4"
          ruff check --no-cache --output-format=github --target-version py38 --line-length 120 \
            --select E,W,F,B,I,UP,C4 --ignore UP031 integrations/python tools .github/scripts

      - name: JavaScript syntax
        run: |
          node --check integrations/javascript/halow-client.mjs
          node --check integrations/javascript/example.mjs
          node -e "JSON.parse(require('fs').readFileSync('integrations/javascript/package.json', 'utf8'))"

      - name: Codec self-tests against testdata/vectors.json (Python, JavaScript)
        run: |
          python integrations/python/halow_client.py selftest
          python integrations/python/example.py --selftest
          node integrations/javascript/example.mjs --selftest

      - name: Shell scripts (bash -n, shellcheck)
        run: |
          bash -n setup-network-linux.sh
          bash -n integrations/curl/alert.sh
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck --severity=warning setup-network-linux.sh integrations/curl/alert.sh

      - name: OpenAPI description (docs/openapi.yaml)
        run: |
          test -f docs/openapi.yaml || { echo "::error file=docs/openapi.yaml::docs/openapi.yaml is missing"; exit 1; }
          npx --yes @redocly/cli@2.72.1 lint --extends=minimal --format=github-actions docs/openapi.yaml

      - name: Markdown relative links
        run: python .github/scripts/check_links.py

      - name: Kit files and versions agree
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          ver="$(sed -nE 's#^[[:space:]]*image:[[:space:]]*ghcr\.io/clearobject/halow-alert:([0-9A-Za-z.+-]+)[[:space:]]*(\#.*)?$#\1#p' docker-compose.yml)"
          [ -n "$ver" ] || fail "docker-compose.yml has no 'image: ghcr.io/clearobject/halow-alert:<version>' line"
          echo "kit version (image tag): $ver"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || fail "version $ver: use X.Y.Z or X.Y.Z-rc.N / -beta.N / -alpha.N (PEP 440 for the Python package)"
          py="$(python integrations/python/halow_client.py --version)"
          pkg="$(node -p "require('./integrations/javascript/package.json').version")"
          mjs="$(node --input-type=module -e "const m = await import('./integrations/javascript/halow-client.mjs'); console.log(m.VERSION)")"
          cs="$(sed -nE 's/.*public const string Version = "([^"]+)".*/\1/p' integrations/csharp/HalowClient.cs)"
          proj="$(sed -nE 's#.*<Version>([^<]+)</Version>.*#\1#p' integrations/csharp/HalowExample.csproj)"
          for pair in "halow_client.py=$py" "package.json=$pkg" "halow-client.mjs=$mjs" "HalowClient.cs=$cs" "HalowExample.csproj=$proj"; do
            [ "${pair#*=}" = "$ver" ] || fail "${pair%%=*} says ${pair#*=}, the image tag in docker-compose.yml is $ver"
          done
          cmp -s integrations/LICENSE integrations/python/LICENSE \
            || fail "integrations/python/LICENSE (packaged with the Python client) must be a copy of integrations/LICENSE"
          grep -qx 'HALOW_TOKEN=' .env.example || fail ".env.example must contain an empty 'HALOW_TOKEN=' line"
          test -f data/.keep || fail "data/.keep is missing"
          for f in setup-network-linux.sh integrations/curl/alert.sh tools/fake_wearable.py; do
            test -x "$f" || fail "$f is not executable (git update-index --chmod=+x $f)"
          done
          python tools/fake_wearable.py --help >/dev/null
          python integrations/python/halow_client.py --help >/dev/null

  csharp:
    name: csharp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the example (.NET 8, C# 8)
        run: dotnet build integrations/csharp -c Release
      - name: Codec self-test against testdata/vectors.json
        run: dotnet run --project integrations/csharp -c Release --no-build -- --selftest integrations/testdata/vectors.json
      - name: HalowClient.cs builds for .NET Standard 2.1 with C# 8 (Unity's level)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netstandard"
          cat > "$RUNNER_TEMP/netstandard/HalowClient.NetStandard.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.1</TargetFramework>
              <LangVersion>8.0</LangVersion>
              <Nullable>disable</Nullable>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="$GITHUB_WORKSPACE/integrations/csharp/HalowClient.cs" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build "$RUNNER_TEMP/netstandard/HalowClient.NetStandard.csproj" -c Release

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config fails without HALOW_TOKEN and passes with it
        run: |
          set -euo pipefail
          fail() { echo "::error file=docker-compose.yml::$*"; exit 1; }
          docker compose version
          if out="$(env -u HALOW_TOKEN docker compose -f docker-compose.yml config 2>&1)"; then
            fail "docker compose config accepts a missing HALOW_TOKEN"
          fi
          echo "without a token: $out"
          grep -q "HALOW_TOKEN" <<<"$out" || fail "the missing-token error does not name HALOW_TOKEN"
          cp .env.example .env              # an unedited copy has an empty HALOW_TOKEN
          if env -u HALOW_TOKEN docker compose -f docker-compose.yml config >/dev/null 2>&1; then
            rm -f .env
            fail "an unedited copy of .env.example (empty HALOW_TOKEN) is accepted"
          fi
          rm -f .env
          HALOW_TOKEN=ci docker compose -f docker-compose.yml config --quiet
          HALOW_TOKEN=ci docker compose -f docker-compose.yml config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '.services["halow-alert"]
                 | .network_mode == "host" and .user == "1000:1000" and .restart == "unless-stopped"
                   and .environment.HALOW_TOKEN == "ci" and .environment.HALOW_IFACE == "192.168.12.50"
                   and (.image | startswith("ghcr.io/clearobject/halow-alert:")) and (has("build") | not)
                   and ([.volumes[] | select(.target == "/data")] | length == 1)' "$RUNNER_TEMP/compose.json" \
            || { cat "$RUNNER_TEMP/compose.json"; fail "unexpected service definition"; }
          HALOW_TOKEN=ci HALOW_UID=1234 HALOW_GID=4321 HALOW_IFACE=127.0.0.1 \
            docker compose -f docker-compose.yml config --format json \
            | jq -e '.services["halow-alert"] | .user == "1234:4321" and .environment.HALOW_IFACE == "127.0.0.1"' \
            || fail "HALOW_UID, HALOW_GID or HALOW_IFACE from the environment (.env) are not applied"

  e2e:
    # The published image, the Compose kit and every integration together, on loopback:
    # the gateway (docker compose) with one stand-in wearable, then each language's
    # direct mode against a second stand-in wearable on its own group and ports.
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HALOW_URL: http://127.0.0.1:18080
      HALOW_TOKEN: ci-e2e
      HALOW_ACK_WAIT: "10"
      GW_GROUP: 239.255.77.1
      GW_PORT: "15000"
      GW_RPORT: "15001"
      DIRECT_GROUP: 239.255.77.2
      DIRECT_PORT: "15010"
      DIRECT_RPORT: "15011"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"           # the oldest version the JavaScript client supports
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the C# example
        run: dotnet build integrations/csharp -c Release

      - name: Enable loopback multicast
        # 'lo' has no MULTICAST flag on Linux and 239.0.0.0/8 has no route to it.
        run: |
          sudo ip link set lo multicast on
          sudo ip route replace 239.0.0.0/8 dev lo
          ip link show lo
          ip route show 239.0.0.0/8

      - name: Pull the image that docker-compose.yml names
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          image="$(docker compose -f docker-compose.yml config --images)"
          [ "$(printf '%s\n' "$image" | wc -l)" = 1 ] || fail "docker-compose.yml names more than one image: $image"
          case "$image" in ghcr.io/clearobject/halow-alert:*) ;; *) fail "unexpected image $image" ;; esac
          version="${image##*:}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if ! docker pull "$image"; then
            fail "cannot pull $image. docker-compose.yml names an image that is not published, or not public, yet. ClearObject publishes the image when it tags that version; once it is public, re-run this job. This check never skips."
          fi
          test "$(docker run --rm "$image" --version)" = "$version" || fail "$image does not report version $version"
          label="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")"
          [ "$label" = "$version" ] || fail "$image has the version label '$label', want $version"
          docker image inspect -f 'user={{.Config.User}} healthcheck={{json .Config.Healthcheck.Test}}' "$image"

      - name: Start two stand-in wearables
        run: |
          set -euo pipefail
          nohup python3 tools/fake_wearable.py --iface 127.0.0.1 --group "$GW_GROUP" --port "$GW_PORT" \
            --response-port "$GW_RPORT" --device-id fake-gateway --seconds 0 > "$RUNNER_TEMP/fake-gateway.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-gateway.pid"
          nohup python3 tools/fake_wearable.py --iface 127.0.0.1 --group "$DIRECT_GROUP" --port "$DIRECT_PORT" \
            --response-port "$DIRECT_RPORT" --device-id fake-direct --seconds 0 > "$RUNNER_TEMP/fake-direct.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-direct.pid"
          for f in fake-gateway fake-direct; do
            for _ in $(seq 50); do grep -q "fake wearable ready" "$RUNNER_TEMP/$f.log" && break; sleep 0.1; done
            grep -q "fake wearable ready" "$RUNNER_TEMP/$f.log" || { cat "$RUNNER_TEMP/$f.log"; echo "::error::$f did not start"; exit 1; }
          done

          # expect-acks N: wait until the gateway's GET /wearables counts N ACKs in total.
          cat > "$RUNNER_TEMP/expect-acks.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          for _ in $(seq 40); do
            curl -fsS "$HALOW_URL/wearables" > "$RUNNER_TEMP/wearables.json"
            [ "$(jq '[.devices[].acks] | add // 0' "$RUNNER_TEMP/wearables.json")" = "$1" ] && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/wearables.json"
          echo "::error::the gateway does not count $1 ACK(s)"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/expect-acks.sh"

      - name: Start the kit with docker compose (gateway on loopback)
        run: |
          set -euo pipefail
          # The kit's docker-compose.yml, unchanged; the settings come from the environment
          # as they would from .env. The override only shortens the health check interval.
          cat > "$RUNNER_TEMP/ci.override.yml" <<'EOF'
          services:
            halow-alert:
              healthcheck:
                interval: 2s
                timeout: 5s
                retries: 3
                start_period: 2s
          EOF
          echo "COMPOSE_PROJECT_NAME=halow-e2e" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=docker-compose.yml:$RUNNER_TEMP/ci.override.yml" >> "$GITHUB_ENV"
          export COMPOSE_PROJECT_NAME=halow-e2e COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/ci.override.yml"
          HALOW_UID="$(id -u)" HALOW_GID="$(id -g)" HALOW_IFACE=127.0.0.1 HALOW_ROUTER=127.0.0.1 \
          HALOW_HTTP=127.0.0.1:18080 HALOW_GROUP="$GW_GROUP" HALOW_PORT="$GW_PORT" \
          HALOW_RESPONSE_PORT="$GW_RPORT" HALOW_HEARTBEAT=2 \
            docker compose up -d
          for _ in $(seq 60); do curl -fsS "$HALOW_URL/health" > "$RUNNER_TEMP/health.json" 2>/dev/null && break; sleep 0.5; done
          cat "$RUNNER_TEMP/health.json"; echo
          jq -e --arg v "$VERSION" '.ok == true and .egress == "127.0.0.1" and .version == $v and .listener == true' \
            "$RUNNER_TEMP/health.json" || { echo "::error::GET /health is not ok"; exit 1; }
          cid="$(docker compose ps -q halow-alert)"
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] && break
            sleep 1
          done
          docker inspect -f 'health={{.State.Health.Status}} user={{.Config.User}}' "$cid"
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ] || { echo "::error::the container is not healthy"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HALOW_URL/alert")"
          [ "$code" = 401 ] || { echo "::error::POST /alert without the token gave $code, want 401"; exit 1; }

      - name: "Gateway mode: Python"
        run: |
          set -euo pipefail
          python3 integrations/python/example.py
          "$RUNNER_TEMP/expect-acks.sh" 1
          sleep 1
          # A second alert within 0.5 s is refused with 429, and the client says so.
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "integrations/python")
          import halow_client as hc
          gw = hc.GatewayClient()
          print(gw.alert(label="python rate-limit test"))
          try:
              gw.alert(label="too soon")
          except hc.HalowError as e:
              assert e.status == 429 and "rate limited" in str(e), e
              print("second alert:", e)
          else:
              sys.exit("a second alert within 0.5 s was accepted")
          EOF
          "$RUNNER_TEMP/expect-acks.sh" 2
          python3 integrations/python/halow_client.py health
          python3 integrations/python/halow_client.py wearables > /dev/null
          rc=0; out="$(HALOW_TOKEN=wrong python3 integrations/python/example.py 2>&1)" || rc=$?
          echo "$out"
          [ "$rc" = 1 ] && grep -q "HTTP 401" <<<"$out" || { echo "::error::a wrong token did not give exit 1 and HTTP 401"; exit 1; }
          # A bad HALOW_ACK_WAIT is refused with exit 2 before anything is sent (the ACK and
          # alert_sent counts checked later would change if it were sent).
          rc=0; HALOW_ACK_WAIT=abc python3 integrations/python/example.py || rc=$?
          [ "$rc" = 2 ] || { echo "::error::HALOW_ACK_WAIT=abc gave exit $rc, want 2"; exit 1; }
          sleep 1

      - name: "Gateway mode: JavaScript (Node.js 18)"
        run: |
          set -euo pipefail
          node --version
          node integrations/javascript/example.mjs
          "$RUNNER_TEMP/expect-acks.sh" 3
          rc=0; out="$(HALOW_TOKEN=wrong node integrations/javascript/example.mjs 2>&1)" || rc=$?
          echo "$out"
          [ "$rc" = 1 ] && grep -q "HTTP 401" <<<"$out" || { echo "::error::a wrong token did not give exit 1 and HTTP 401"; exit 1; }
          rc=0; HALOW_ACK_WAIT=abc node integrations/javascript/example.mjs || rc=$?
          [ "$rc" = 2 ] || { echo "::error::HALOW_ACK_WAIT=abc gave exit $rc, want 2"; exit 1; }
          sleep 1

      - name: "Gateway mode: curl"
        run: |
          set -euo pipefail
          integrations/curl/alert.sh "curl example" | tee "$RUNNER_TEMP/curl.json"
          jq -e '.event == "alert_sent" and .egress == "127.0.0.1"' "$RUNNER_TEMP/curl.json"
          "$RUNNER_TEMP/expect-acks.sh" 4
          rc=0; out="$(HALOW_TOKEN=wrong integrations/curl/alert.sh 2>&1)" || rc=$?
          echo "$out"
          [ "$rc" = 1 ] && grep -q "HTTP 401" <<<"$out" || { echo "::error::a wrong token did not give exit 1 and HTTP 401"; exit 1; }
          curl -fsS --noproxy '*' "$HALOW_URL/health" | jq -e '.ok == true'
          sleep 1

      - name: "Gateway mode: C#"
        run: |
          set -euo pipefail
          dotnet run --project integrations/csharp -c Release --no-build
          "$RUNNER_TEMP/expect-acks.sh" 5
          rc=0; out="$(HALOW_TOKEN=wrong dotnet run --project integrations/csharp -c Release --no-build 2>&1)" || rc=$?
          echo "$out"
          [ "$rc" = 1 ] && grep -q "HTTP 401" <<<"$out" || { echo "::error::a wrong token did not give exit 1 and HTTP 401"; exit 1; }
          rc=0; HALOW_ACK_WAIT=abc dotnet run --project integrations/csharp -c Release --no-build || rc=$?
          [ "$rc" = 2 ] || { echo "::error::HALOW_ACK_WAIT=abc gave exit $rc, want 2"; exit 1; }
          sleep 1

      - name: "Gateway mode: Python 3.8"
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$GITHUB_WORKSPACE/integrations:/integrations:ro" \
            -e HALOW_URL -e HALOW_TOKEN -e HALOW_ACK_WAIT -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.8-slim python3 /integrations/python/example.py
          "$RUNNER_TEMP/expect-acks.sh" 6

      - name: "Direct mode: every language against the second stand-in wearable"
        env:
          HALOW_EGRESS: 127.0.0.1
        run: |
          set -euo pipefail
          export HALOW_GROUP="$DIRECT_GROUP" HALOW_PORT="$DIRECT_PORT" HALOW_RESPONSE_PORT="$DIRECT_RPORT"
          check() {   # name, output file: a heartbeat from fake-direct and an ACK
            grep -q "HEARTBEAT from 127.0.0.1: device_id=fake-direct" "$2" || { echo "::error::$1: no heartbeat from the stand-in wearable"; exit 1; }
            grep -q "ACK from 127.0.0.1" "$2" || { echo "::error::$1: no ACK"; exit 1; }
          }
          echo "::group::python"
          python3 integrations/python/example.py --direct | tee "$RUNNER_TEMP/direct-python.log"
          check python "$RUNNER_TEMP/direct-python.log"
          python3 integrations/python/halow_client.py direct-alert --egress 127.0.0.1 --group "$DIRECT_GROUP" \
            --port "$DIRECT_PORT" --response-port "$DIRECT_RPORT" --format both --burst-seconds 0.5 --wait-acks 2 \
            | tee "$RUNNER_TEMP/direct-cli.log"
          grep -qE "^[1-9][0-9]* ACK\(s\) from 1 wearable\(s\)" "$RUNNER_TEMP/direct-cli.log" || { echo "::error::python CLI: no ACK"; exit 1; }
          echo "::endgroup::"
          echo "::group::javascript"
          node integrations/javascript/example.mjs --direct | tee "$RUNNER_TEMP/direct-javascript.log"
          check javascript "$RUNNER_TEMP/direct-javascript.log"
          echo "::endgroup::"
          echo "::group::csharp"
          dotnet run --project integrations/csharp -c Release --no-build -- --direct | tee "$RUNNER_TEMP/direct-csharp.log"
          check csharp "$RUNNER_TEMP/direct-csharp.log"
          echo "::endgroup::"
          echo "::group::python 3.8"
          docker run --rm --network host -v "$GITHUB_WORKSPACE/integrations:/integrations:ro" \
            -e HALOW_EGRESS -e HALOW_GROUP -e HALOW_PORT -e HALOW_RESPONSE_PORT -e HALOW_ACK_WAIT -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.8-slim python3 /integrations/python/example.py --direct | tee "$RUNNER_TEMP/direct-python38.log"
          check "python 3.8" "$RUNNER_TEMP/direct-python38.log"
          echo "::endgroup::"

      - name: The gateway saw only its own alerts, and the kit's ./data has the log
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          "$RUNNER_TEMP/expect-acks.sh" 6         # direct-mode ACKs went to the direct listeners, not here
          jq -e '.devices | length == 1 and .[0].ip == "127.0.0.1" and .[0].device_id == "fake-gateway" and .[0].heartbeats >= 1' \
            "$RUNNER_TEMP/wearables.json" || fail "unexpected GET /wearables"
          log=data/halow-alert.jsonl
          test -s "$log" || fail "the container did not write ./$log"
          [ "$(stat -c %u "$log")" = "$(id -u)" ] || fail "./$log is not owned by HALOW_UID"
          [ "$(grep -c '"event":"alert_sent"' "$log")" = 6 ] || fail "want 6 alert_sent lines in ./$log"
          for label in "python example" "javascript example" "curl example" "csharp example"; do
            grep -q "\"source\":\"http:127.0.0.1:$label\"" "$log" || fail "no alert labelled '$label' in ./$log"
          done
          grep -q '"event":"wearable_ack"' "$log" || fail "no wearable_ack in ./$log"
          echo "end to end: OK"

      - name: Diagnostics
        if: failure()
        run: |
          echo "::group::gateway (docker compose logs)"; docker compose logs --no-color 2>&1 || true; echo "::endgroup::"
          for f in fake-gateway fake-direct; do
            echo "::group::$f"; cat "$RUNNER_TEMP/$f.log" 2>/dev/null || true; echo "::endgroup::"
          done
          echo "::group::data/halow-alert.jsonl"; tail -n 50 data/halow-alert.jsonl 2>/dev/null || true; echo "::endgroup::"

      - name: Clean up
        if: always()
        run: |
          docker compose down --timeout 5 2>/dev/null || true
          for f in fake-gateway fake-direct; do
            [ -f "$RUNNER_TEMP/$f.pid" ] && kill "$(cat "$RUNNER_TEMP/$f.pid")" 2>/dev/null || true
          done

  windows-direct:
    # Direct mode of every language on Windows, against the stand-in wearable on loopback,
    # as integrations/README.md "Try it without hardware" describes it. Everything runs in
    # one step, so the stand-in is stopped before the step ends.
    name: windows-direct
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HALOW_EGRESS: 127.0.0.1
      HALOW_GROUP: 239.255.77.2
      HALOW_PORT: "15010"
      HALOW_RESPONSE_PORT: "15011"
      HALOW_ACK_WAIT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"           # the oldest version the JavaScript client supports
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the C# example
        run: dotnet build integrations/csharp -c Release
      - name: "Direct mode: Python, JavaScript and C# against the stand-in wearable"
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'fake.log'
          $err = Join-Path $env:RUNNER_TEMP 'fake.err'
          $fakeArgs = @('tools/fake_wearable.py', '--iface', '127.0.0.1', '--group', $env:HALOW_GROUP,
                        '--port', $env:HALOW_PORT, '--response-port', $env:HALOW_RESPONSE_PORT,
                        '--device-id', 'fake-direct', '--seconds', '0')
          $fake = Start-Process python -ArgumentList $fakeArgs -RedirectStandardOutput $log `
                    -RedirectStandardError $err -NoNewWindow -PassThru
          function Get-Alerts { @(Select-String -Path $log -Pattern 'ALERT from' -ErrorAction SilentlyContinue).Count }
          try {
            $ready = $false
            for ($i = 0; $i -lt 100 -and -not $ready; $i++) {
              Start-Sleep -Milliseconds 100
              $ready = (Test-Path $log) -and [bool](Select-String -Quiet -Path $log -Pattern 'fake wearable ready')
              if ($fake.HasExited) { break }
            }
            if (-not $ready) { throw 'the stand-in wearable did not start' }
            $runs = @(
              @{ name = 'python';     exe = 'python'; args = @('integrations/python/example.py', '--direct') },
              @{ name = 'javascript'; exe = 'node';   args = @('integrations/javascript/example.mjs', '--direct') },
              @{ name = 'csharp';     exe = 'dotnet'; args = @('run', '--project', 'integrations/csharp', '-c', 'Release', '--no-build', '--', '--direct') }
            )
            foreach ($r in $runs) {
              Write-Output "::group::$($r.name)"
              $out = & $r.exe @($r.args) | Out-String
              $code = $LASTEXITCODE
              Write-Output $out
              Write-Output '::endgroup::'
              if ($code -ne 0) { throw "$($r.name): exit code $code" }
              if ($out -notmatch 'HEARTBEAT from 127\.0\.0\.1: device_id=fake-direct') { throw "$($r.name): no heartbeat from the stand-in wearable" }
              if ($out -notmatch 'ACK from 127\.0\.0\.1') { throw "$($r.name): no ACK" }
            }
            # A bad HALOW_ACK_WAIT is refused with exit 2 before anything is sent.
            $before = Get-Alerts
            $env:HALOW_ACK_WAIT = 'abc'
            foreach ($r in $runs) {
              & $r.exe @($r.args) | Out-Null
              $code = $LASTEXITCODE
              if ($code -ne 2) { throw "$($r.name): HALOW_ACK_WAIT=abc gave exit code $code, want 2" }
            }
            Start-Sleep -Seconds 1
            if ((Get-Alerts) -ne $before) { throw 'an example sent an alert although HALOW_ACK_WAIT was invalid' }
          } finally {
            if (-not $fake.HasExited) { Stop-Process -Id $fake.Id -Force }
            Write-Output '::group::stand-in wearable output'
            Get-Content $log, $err -ErrorAction SilentlyContinue
            Write-Output '::endgroup::'
          }
          Write-Output 'windows direct mode: OK'
          exit 0

  python-package:
    # The Python client (integrations/python) as a package: its tests against the source
    # file, then one sdist and one wheel, built with the pinned tools in
    # .github/requirements-python-build.txt and checked. python-package-test installs that
    # wheel; release.yml builds the release's own with the same tools and checks.
    name: python-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable loopback multicast
        # 'lo' has no MULTICAST flag on Linux and 239.0.0.0/8 has no route to it.
        run: |
          sudo ip link set lo multicast on
          sudo ip route replace 239.0.0.0/8 dev lo

      - name: Tests against the source file
        env:
          HALOW_TEST_REQUIRE_MULTICAST: "1"
        run: python -m unittest discover -s integrations/python/tests -v

      - name: Build the sdist and the wheel
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r .github/requirements-python-build.txt
          python -m build --version
          rm -rf "$RUNNER_TEMP/python-dist"
          python -m build --outdir "$RUNNER_TEMP/python-dist" integrations/python
          ls -l "$RUNNER_TEMP/python-dist"

      - name: twine check --strict
        run: python -m twine check --strict "$RUNNER_TEMP"/python-dist/*

      - name: Contents and metadata (version = halow_client.__version__)
        run: python .github/scripts/check_python_dist.py "$RUNNER_TEMP/python-dist"

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  python-package-test:
    # The wheel from python-package, installed into a fresh virtual environment (not from
    # the source, not editable), on each platform; then the tests against the installed
    # module (HALOW_TEST_INSTALLED=1 makes them import it, not the source file).
    name: python-package-test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: python-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04                # the newest Ubuntu runner with a Python 3.8 build (none for 26.04)
            python: "3.8"
            require-multicast: "1"
          - os: ubuntu-24.04
            python: "3.13"
            require-multicast: "1"
          - os: macos-latest                # multicast works on lo0 without setup
            python: "3.12"
            require-multicast: "1"
          - os: windows-latest
            python: "3.12"
            # Direct mode on Windows is what the windows-direct job proves, and the docs still
            # say "Not yet tested on Windows". Until windows-direct is green, the direct-mode
            # tests may skip here when loopback multicast does not work; then set "1".
            require-multicast: "0"
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist

      - name: Enable loopback multicast
        if: runner.os == 'Linux'
        run: |
          sudo ip link set lo multicast on
          sudo ip route replace 239.0.0.0/8 dev lo

      - name: Install the wheel into a fresh virtual environment
        run: |
          set -euo pipefail
          tmp="$(cd "$RUNNER_TEMP" && pwd)"          # a POSIX path, also in Git Bash on Windows
          shopt -s nullglob
          wheels=("$tmp"/python-dist/*.whl)
          [ "${#wheels[@]}" = 1 ] || { ls -l "$tmp/python-dist"; echo "::error::want exactly one wheel"; exit 1; }
          python -m venv "$tmp/venv"
          if [ "$RUNNER_OS" = Windows ]; then bin="$tmp/venv/Scripts"; else bin="$tmp/venv/bin"; fi
          "$bin/python" -m pip install --disable-pip-version-check --no-index --no-deps "${wheels[0]}"
          "$bin/python" -m pip show --files clearobject-halow-client
          echo "VENV_BIN=$bin" >> "$GITHUB_ENV"

      - name: The installed command, the module and its public API
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          want="$(python integrations/python/halow_client.py --version | tr -d '\r')"
          vectors="$PWD/integrations/testdata/vectors.json"
          cd "$RUNNER_TEMP"                          # away from the checkout: only the installed module
          got="$("$VENV_BIN/halow-client" --version | tr -d '\r')"
          [ "$got" = "$want" ] || fail "halow-client --version says $got, want $want"
          got="$("$VENV_BIN/python" -m halow_client --version | tr -d '\r')"
          [ "$got" = "$want" ] || fail "python -m halow_client --version says $got, want $want"
          "$VENV_BIN/halow-client" --help > /dev/null
          "$VENV_BIN/halow-client" selftest "$vectors"
          "$VENV_BIN/python" - <<'EOF'
          import os
          import sys

          import halow_client
          from halow_client import (GatewayClient, HalowError, ResponseListener, decode_device_response,
                                    encode_gateway_message, encode_raw8, main, selftest, send_direct,
                                    send_heartbeat_request)

          path = os.path.realpath(halow_client.__file__)
          print("halow_client", halow_client.__version__, "imported from", path)
          if not path.startswith(os.path.realpath(sys.prefix) + os.sep):
              sys.exit("halow_client was not imported from the virtual environment")
          EOF

      - name: Tests against the installed package
        env:
          HALOW_TEST_INSTALLED: "1"
          HALOW_TEST_REQUIRE_MULTICAST: ${{ matrix.require-multicast }}
        run: '"$VENV_BIN/python" -m unittest discover -s integrations/python/tests -v'

  python-package-ok:
    # One required check for the package jobs, whatever the matrix holds.
    name: python-package-ok
    needs: [python-package, python-package-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The package was built, checked and tested on every platform
        env:
          BUILD: ${{ needs.python-package.result }}
          TEST: ${{ needs.python-package-test.result }}
        run: |
          echo "python-package: $BUILD; python-package-test: $TEST"
          if [ "$BUILD" != success ] || [ "$TEST" != success ]; then
            echo "::error::python-package or a python-package-test leg did not succeed"
            exit 1
          fi

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan the tree for secrets
        run: /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - name: Scan the history of this commit for secrets
        run: /tmp/gitleaks git . --log-opts=HEAD --config .gitleaks.toml --redact --no-banner
